name: Import historical stats to Supabase

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stats-supabase-historical-import
  cancel-in-progress: false

jobs:
  import-history:
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      STATS_SEASON: "2025-2026"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check database secret
        shell: bash
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::Falta el secret SUPABASE_DB_URL. Este workflow ya no aplica schema; solo importa los datos históricos cuando la base ya está migrada."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install temporary Postgres driver
        run: npm install --no-save --package-lock=false pg

      - name: Import historical JSON data
        run: node scripts/migrate_stats_via_postgres.mjs

      - name: Confirm no repository data changed
        shell: bash
        run: |
          if ! git diff --quiet -- public/data excels package.json package-lock.json; then
            echo "::error::La importación modificó archivos legacy inesperadamente."
            git diff -- public/data excels package.json package-lock.json
            exit 1
          fi
          echo "Importación completada sin modificar Excel, JSON ni package files."

name: Test Fantasy trait engine

on:
  push:
    branches:
      - feat/fantasy-season-traits

jobs:
  test-traits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/fantasy-season-traits
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify dynamic synergy engine
        run: |
          node --input-type=module <<'NODE'
          import { computeLineupBreakdown } from './src/lib/fantasyScoring.js';

          const approx = (actual, expected, label) => {
            if (Math.abs(actual - expected) > 1e-9) {
              throw new Error(`${label}: expected ${expected}, got ${actual}`);
            }
          };

          const traits2526 = {
            traits: {
              V: { code: 'V', label: 'Vieja guardia', activation_type: 'coach_match', multiplier: 1.5, required_count: 1 },
              P: { code: 'P', label: 'Primos', activation_type: 'lineup_count', multiplier: 1.5, required_count: 2 },
            },
            playerTraitsByNumber: { '9': ['V','P'], '21': ['V','P'] },
            coachTraitsByCode: {},
          };
          const stats2526 = new Map([
            [9, { name: 'Aingeru', pir: 10 }],
            [21, { name: 'Julen', pir: 10 }],
          ]);
          const primos = computeLineupBreakdown({ playersNums: [9,21], statsMap: stats2526, traitConfig: traits2526 });
          approx(primos.totalPoints, 30, 'Primos 2025-2026');
          if (!primos.players.every((p) => p.synergies.some((s) => s.includes('Primos')))) {
            throw new Error('Primos label missing from 2025-2026 breakdown');
          }

          const onePrimo = computeLineupBreakdown({ playersNums: [21], statsMap: stats2526, traitConfig: traits2526 });
          approx(onePrimo.totalPoints, 10, 'Single P trait must not activate');

          const traits2627 = {
            traits: {
              V: { code: 'V', label: 'Vieja guardia', activation_type: 'coach_match', multiplier: 1.5, required_count: 1 },
              JP: { code: 'JP', label: 'Julen Power', activation_type: 'lineup_count', multiplier: 1.5, required_count: 2 },
              A: { code: 'A', label: 'Alcohólico', activation_type: 'coach_match', multiplier: 1.5, required_count: 1 },
            },
            playerTraitsByNumber: { '21': ['V','JP'], '22': ['JP'], '13': ['A','V'] },
            coachTraitsByCode: { david: ['S','A'] },
          };
          const stats2627 = new Map([
            [21, { name: 'Julen', pir: 10 }],
            [22, { name: 'Julen Anda', pir: 10 }],
            [13, { name: 'Aguirre', pir: 10 }],
          ]);
          const julenPower = computeLineupBreakdown({ playersNums: [21,22], statsMap: stats2627, traitConfig: traits2627 });
          approx(julenPower.totalPoints, 30, 'Julen Power 2026-2027');
          if (!julenPower.players.every((p) => p.synergies.some((s) => s.includes('Julen Power')))) {
            throw new Error('Julen Power label missing from 2026-2027 breakdown');
          }

          const oneJulen = computeLineupBreakdown({ playersNums: [21], statsMap: stats2627, traitConfig: traits2627 });
          approx(oneJulen.totalPoints, 10, 'Single Julen must not activate Julen Power');

          const coachMatch = computeLineupBreakdown({ playersNums: [13], statsMap: stats2627, coachCode: 'david', traitConfig: traits2627 });
          approx(coachMatch.totalPoints, 15, 'Coach-match trait');

          console.log('Fantasy trait engine OK');
          NODE

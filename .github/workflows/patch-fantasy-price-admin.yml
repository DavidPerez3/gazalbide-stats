name: Patch Fantasy price admin

on:
  push:
    branches:
      - feat/fantasy-initial-prices

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/fantasy-initial-prices
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply Admin market patch
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("src/pages/AdminPage.jsx")
          text = path.read_text()

          def one(old, new):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one match, found {count}: {old[:100]!r}")
              text = text.replace(old, new, 1)

          one(
            'import { getFantasySeasonStatus } from "../lib/fantasyMarket.js";\n',
            'import { getFantasySeasonStatus, loadFantasyMarket } from "../lib/fantasyMarket.js";\n'
          )

          # Remove the legacy manual autofill implementation. New gameweeks already
          # receive the previous lineup through the database trigger and historical
          # fantasy_players.json must not be used for 2026-2027 prices.
          pattern = r'// === Helpers autorrelleno \(mismos que en el script\) ===.*?\nexport default function AdminPage\(\) \{'
          text, n = re.subn(pattern, 'export default function AdminPage() {', text, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f"Could not remove legacy autofill block: {n}")

          one(
            '  const [marketStatus, setMarketStatus] = useState(null);\n',
            '  const [marketStatus, setMarketStatus] = useState(null);\n  const [marketPlayers, setMarketPlayers] = useState([]);\n  const [priceDrafts, setPriceDrafts] = useState({});\n  const [savingPrices, setSavingPrices] = useState(false);\n'
          )
          text = text.replace('  const [autoFillingGwId, setAutoFillingGwId] = useState(null);\n\n', '')

          one(
            '''      try {\n        setMarketStatus(await getFantasySeasonStatus(CURRENT_SEASON_ID));\n      } catch (marketError) {\n        console.error("Error cargando estado del mercado:", marketError);\n      }\n''',
            '''      try {\n        const [status, players] = await Promise.all([\n          getFantasySeasonStatus(CURRENT_SEASON_ID),\n          loadFantasyMarket({ seasonId: CURRENT_SEASON_ID }),\n        ]);\n        setMarketStatus(status);\n        setMarketPlayers(players);\n        setPriceDrafts(\n          Object.fromEntries(players.map((player) => [player.player_id, player.price ?? ""]))\n        );\n      } catch (marketError) {\n        console.error("Error cargando estado del mercado:", marketError);\n      }\n'''
          )

          marker = '''  async function handleCreateGameweek(e) {\n'''
          if marker not in text:
              raise SystemExit("handleCreateGameweek marker not found")
          save_fn = '''  async function handleSaveMarketPrices() {\n    setErrorMsg(null);\n    setInfoMsg(null);\n\n    const rows = [];\n    for (const player of marketPlayers) {\n      const price = Number(priceDrafts[player.player_id]);\n      if (!Number.isInteger(price) || price <= 0) {\n        setErrorMsg(`Precio inválido para ${player.name}.`);\n        return;\n      }\n      rows.push({\n        season_id: CURRENT_SEASON_ID,\n        player_id: player.player_id,\n        price,\n        enabled: true,\n        updated_at: new Date().toISOString(),\n      });\n    }\n\n    if (!rows.length) {\n      setErrorMsg("No hay jugadores en el mercado actual.");\n      return;\n    }\n\n    setSavingPrices(true);\n    const { error } = await supabase\n      .from("fantasy_player_market")\n      .upsert(rows, { onConflict: "season_id,player_id" });\n    setSavingPrices(false);\n\n    if (error) {\n      console.error("Error guardando precios Fantasy:", error);\n      setErrorMsg("No se han podido guardar los precios: " + (error.message || "error desconocido"));\n      return;\n    }\n\n    setMarketPlayers((prev) =>\n      prev.map((player) => ({\n        ...player,\n        price: Number(priceDrafts[player.player_id]),\n      }))\n    );\n    setMarketStatus(await getFantasySeasonStatus(CURRENT_SEASON_ID));\n    setInfoMsg("Precios Fantasy guardados. El mercado sigue bloqueado hasta terminar la configuración de temporada.");\n  }\n\n'''
          text = text.replace(marker, save_fn + marker, 1)

          render_marker = '          {/* Formulario creación de jornada */}\n'
          if render_marker not in text:
              raise SystemExit("render marker not found")
          market_section = '''          {/* Mercado Fantasy de la temporada */}\n          <section className="admin__section">\n            <h2 className="admin__section-title">Precios Fantasy {CURRENT_SEASON_ID}</h2>\n            <p className="admin__text">\n              Precios provisionales del mercado actual. Puedes ajustarlos desde aquí antes de abrir la primera jornada.\n            </p>\n            {marketPlayers.length === 0 ? (\n              <p className="admin__text">Todavía no hay precios cargados.</p>\n            ) : (\n              <div className="admin__list" style={{ display: "grid", gap: "0.55rem" }}>\n                {marketPlayers.map((player) => (\n                  <div\n                    key={player.player_id}\n                    className="admin__list-item"\n                    style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: "1rem" }}\n                  >\n                    <div>\n                      <strong>#{Number(player.number) === 0 ? "00" : player.number} · {player.name}</strong>\n                    </div>\n                    <label style={{ display: "flex", alignItems: "center", gap: "0.4rem", flexShrink: 0 }}>\n                      <input\n                        type="number"\n                        min="1"\n                        step="1"\n                        className="admin__input"\n                        style={{ width: 82, textAlign: "center" }}\n                        value={priceDrafts[player.player_id] ?? ""}\n                        onChange={(e) =>\n                          setPriceDrafts((prev) => ({ ...prev, [player.player_id]: e.target.value }))\n                        }\n                      />\n                      <span>🍺</span>\n                    </label>\n                  </div>\n                ))}\n              </div>\n            )}\n            <button\n              type="button"\n              className="admin__button"\n              style={{ marginTop: "0.75rem" }}\n              onClick={handleSaveMarketPrices}\n              disabled={savingPrices || marketPlayers.length === 0}\n            >\n              {savingPrices ? "Guardando precios..." : "Guardar precios"}\n            </button>\n            <p className="admin__text" style={{ marginTop: "0.65rem" }}>\n              Estado: <strong>{marketStatus?.marketReady ? "listo" : "bloqueado"}</strong>. Crear una jornada seguirá deshabilitado hasta terminar precios, rasgos y entrenadores.\n            </p>\n          </section>\n\n'''
          text = text.replace(render_marker, market_section + render_marker, 1)

          # Remove the obsolete manual autofill button from every gameweek card.
          pattern_button = r'\n\s*\{/\* Botón de autorrelleno para esta jornada \*/\}.*?</button>'
          text, n = re.subn(pattern_button, '', text, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f"Could not remove autofill button: {n}")

          path.write_text(text)

      - name: Build
        run: |
          npm ci
          npm run build
      - name: Remove one-off workflow
        run: rm .github/workflows/patch-fantasy-price-admin.yml
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/AdminPage.jsx supabase/migrations/20260815164000_fantasy_initial_prices_2627.sql .github/workflows/patch-fantasy-price-admin.yml
          git commit -m "feat(fantasy): add provisional prices and mobile admin editor"
          git push origin HEAD:feat/fantasy-initial-prices

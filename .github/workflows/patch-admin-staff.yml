name: Patch Admin staff

on:
  push:
    branches:
      - feat/admin-staff-management

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/admin-staff-management
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Wire staff management
        shell: python
        run: |
          from pathlib import Path
          import re

          # AdminPlayers: embed staff section and keep Android gallery available.
          p = Path('src/pages/AdminPlayers.jsx')
          text = p.read_text()
          old_import = 'import PlayerPhoto from "../components/PlayerPhoto.jsx";\n'
          new_import = old_import + 'import AdminStaffSection from "../components/AdminStaffSection.jsx";\n'
          if text.count(old_import) != 1:
              raise SystemExit('AdminStaffSection import anchor mismatch')
          text = text.replace(old_import, new_import, 1)
          text = text.replace('            capture="environment"\n', '')
          tail = '      </section>\n    </div>\n  );\n}\n'
          if text.count(tail) != 1:
              raise SystemExit(f'AdminPlayers tail mismatch: {text.count(tail)}')
          text = text.replace(
              tail,
              '      </section>\n\n      <AdminStaffSection />\n    </div>\n  );\n}\n',
              1,
          )
          p.write_text(text)

          # Fantasy market: resolve new staff-photos Storage paths, not only local images.
          p = Path('src/lib/fantasyMarket.js')
          text = p.read_text()
          player_import = 'import { resolvePlayerPhotoSrc } from "./playerPhotos.js";\n'
          if text.count(player_import) != 1:
              raise SystemExit('fantasyMarket import anchor mismatch')
          text = text.replace(
              player_import,
              player_import + 'import { resolveStaffPhotoSrc } from "./staffPhotos.js";\n',
              1,
          )
          text, n = re.subn(
              r'\nfunction resolveStaffPhotoSrc\(photoPath\) \{.*?\n\}\n',
              '\n',
              text,
              count=1,
              flags=re.S,
          )
          if n != 1:
              raise SystemExit('old staff photo resolver not found')
          old_call = '        image: resolveStaffPhotoSrc(member.photo_path),\n'
          if text.count(old_call) != 1:
              raise SystemExit('staff photo call anchor mismatch')
          text = text.replace(old_call, '        image: resolveStaffPhotoSrc(member),\n', 1)
          p.write_text(text)

      - name: Build
        run: |
          npm ci
          npm run build

      - name: Remove one-off workflow
        run: rm .github/workflows/patch-admin-staff.yml

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/AdminPlayers.jsx src/lib/fantasyMarket.js .github/workflows/patch-admin-staff.yml
          git commit -m "feat(staff): expose staff management in mobile Admin"
          git push origin HEAD:feat/admin-staff-management

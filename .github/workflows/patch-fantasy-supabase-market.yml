name: Patch Fantasy Supabase market

on:
  push:
    branches:
      - feat/fantasy-supabase-market

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/fantasy-supabase-market
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply market patch
        shell: python
        run: |
          from pathlib import Path

          def one(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected 1 match in {path}, found {count}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          # ---------------- FantasyHome ----------------
          one(
            "src/pages/FantasyHome.jsx",
            'import { CURRENT_SEASON_ID } from "../lib/seasons.js";\n',
            'import { CURRENT_SEASON_ID } from "../lib/seasons.js";\nimport { getFantasySeasonStatus, loadFantasyCoaches, loadFantasyMarket } from "../lib/fantasyMarket.js";\n',
          )
          one(
            "src/pages/FantasyHome.jsx",
            '  const [fantasyPlayers, setFantasyPlayers] = useState([]);\n  const [loadingPlayers, setLoadingPlayers] = useState(false);\n',
            '  const [fantasyPlayers, setFantasyPlayers] = useState([]);\n  const [fantasyCoaches, setFantasyCoaches] = useState([]);\n  const [seasonStatus, setSeasonStatus] = useState(null);\n  const [loadingPlayers, setLoadingPlayers] = useState(false);\n',
          )
          one(
            "src/pages/FantasyHome.jsx",
            '  const BASE = import.meta.env.BASE_URL || "/";\n  const courtSrc = `${BASE}images/court.png`;\n',
            '''  const BASE = import.meta.env.BASE_URL || "/";\n  const courtSrc = `${BASE}images/court.png`;\n\n  useEffect(() => {\n    let cancelled = false;\n    getFantasySeasonStatus(CURRENT_SEASON_ID)\n      .then((status) => { if (!cancelled) setSeasonStatus(status); })\n      .catch((error) => console.error("Error cargando estado del mercado Fantasy:", error));\n    return () => { cancelled = true; };\n  }, []);\n''',
          )
          one(
            "src/pages/FantasyHome.jsx",
            '''        // Jugadores fantasy\n        const res = await fetch(`${BASE}data/fantasy_players.json`);\n        if (!res.ok)\n          throw new Error("No se ha podido cargar fantasy_players.json");\n        const json = await res.json();\n        setFantasyPlayers(json);\n''',
            '''        // Mercado y staff de la temporada actual desde Supabase.\n        const [marketPlayers, coaches] = await Promise.all([\n          loadFantasyMarket({\n            seasonId: CURRENT_SEASON_ID,\n            gameweekId: lineupRow?.gameweek_id ?? null,\n          }),\n          loadFantasyCoaches(CURRENT_SEASON_ID),\n        ]);\n        setFantasyPlayers(marketPlayers);\n        setFantasyCoaches(coaches);\n''',
          )
          one(
            "src/pages/FantasyHome.jsx",
            '  const totalBudget = team?.cervezas ?? 0;\n',
            '  const totalBudget = team?.cervezas ?? seasonStatus?.baseBudget ?? 80;\n',
          )
          one(
            "src/pages/FantasyHome.jsx",
            '  const hasCoach = !!coachCode;\n',
            '''  const selectedCoach = useMemo(\n    () => fantasyCoaches.find((coach) => coach.code === coachCode) || null,\n    [fantasyCoaches, coachCode]\n  );\n\n  const hasCoach = !!coachCode;\n''',
          )
          one(
            "src/pages/FantasyHome.jsx",
            '''        {p.image && (() => {\n          const imgSrc = `${import.meta.env.BASE_URL}${p.image.replace(\n            /^\\/+/,\n            ""\n          )}`;\n          return (\n''',
            '''        {p.image && (() => {\n          const imgSrc = p.image;\n          return (\n''',
          )
          one(
            "src/pages/FantasyHome.jsx",
            '''                        <div className="fantasy-builder__coach-avatar">\n                          <img\n                            src={`${import.meta.env.BASE_URL}images/coaches/${coachCode}.png`}\n                            alt={COACH_LABELS[coachCode] || coachCode}\n                            className="fantasy-builder__coach-photo"\n                          />\n                        </div>\n                        <div className="fantasy-builder__coach-info">\n                          <span className="fantasy-builder__coach-name">\n                            {COACH_LABELS[coachCode] || coachCode}\n                          </span>\n''',
            '''                        <div className="fantasy-builder__coach-avatar">\n                          {selectedCoach?.image ? (\n                            <img\n                              src={selectedCoach.image}\n                              alt={selectedCoach.name || coachCode}\n                              className="fantasy-builder__coach-photo"\n                            />\n                          ) : (\n                            <span style={{ fontWeight: 800, fontSize: "1.25rem" }}>\n                              {(selectedCoach?.name || coachCode).slice(0, 1).toUpperCase()}\n                            </span>\n                          )}\n                        </div>\n                        <div className="fantasy-builder__coach-info">\n                          <span className="fantasy-builder__coach-name">\n                            {selectedCoach?.name || COACH_LABELS[coachCode] || coachCode}\n                          </span>\n''',
          )

          # ---------------- FantasyBuilder ----------------
          one(
            "src/pages/FantasyBuilder.jsx",
            'import { CURRENT_SEASON_ID } from "../lib/seasons.js";\n',
            'import { CURRENT_SEASON_ID } from "../lib/seasons.js";\nimport { loadFantasyCoaches, loadFantasyMarket } from "../lib/fantasyMarket.js";\n',
          )
          one(
            "src/pages/FantasyBuilder.jsx",
            '  const [players, setPlayers] = useState([]);\n',
            '  const [players, setPlayers] = useState([]);\n  const [coaches, setCoaches] = useState([]);\n',
          )
          one(
            "src/pages/FantasyBuilder.jsx",
            '''        // Jugadores disponibles\n        const res = await fetch(`${BASE}data/fantasy_players.json`);\n        if (!res.ok)\n          throw new Error("No se ha podido cargar fantasy_players.json");\n        const json = await res.json();\n        setPlayers(json);\n''',
            '''        // Jugadores y entrenadores disponibles de esta temporada.\n        const [marketPlayers, coachOptions] = await Promise.all([\n          loadFantasyMarket({ seasonId: CURRENT_SEASON_ID, gameweekId: gwData.id }),\n          loadFantasyCoaches(CURRENT_SEASON_ID),\n        ]);\n        setPlayers(marketPlayers);\n        setCoaches(coachOptions);\n''',
          )
          one(
            "src/pages/FantasyBuilder.jsx",
            '  const currentCoachCode = lineup?.coach_code || null;\n',
            '''  const currentCoachCode = lineup?.coach_code || null;\n  const currentCoach = useMemo(\n    () => coaches.find((coach) => coach.code === currentCoachCode) || null,\n    [coaches, currentCoachCode]\n  );\n''',
          )
          one(
            "src/pages/FantasyBuilder.jsx",
            '<strong>{COACH_LABELS[currentCoachCode]}</strong>',
            '<strong>{currentCoach?.name || COACH_LABELS[currentCoachCode] || currentCoachCode}</strong>',
          )
          one(
            "src/pages/FantasyBuilder.jsx",
            '{COACHES.map((coach) => {',
            '{coaches.map((coach) => {',
          )
          one(
            "src/pages/FantasyBuilder.jsx",
            '                const name = COACH_LABELS[code] || code;\n',
            '                const name = coach.name || COACH_LABELS[code] || code;\n',
          )
          one(
            "src/pages/FantasyBuilder.jsx",
            '''                        <img\n                          src={`${import.meta.env.BASE_URL}images/coaches/${code}.png`}\n                          alt={name}\n                          style={{\n                            width: "100%",\n                            height: "100%",\n                            objectFit: "cover",\n                            display: "block",\n                          }}\n                        />\n''',
            '''                        {coach.image ? (\n                          <img\n                            src={coach.image}\n                            alt={name}\n                            style={{\n                              width: "100%",\n                              height: "100%",\n                              objectFit: "cover",\n                              display: "block",\n                            }}\n                          />\n                        ) : (\n                          <span style={{ fontWeight: 800, fontSize: "1.25rem" }}>\n                            {name.slice(0, 1).toUpperCase()}\n                          </span>\n                        )}\n''',
          )
          one(
            "src/pages/FantasyBuilder.jsx",
            '''                      {p.image && (\n                        <img\n                          src={`${import.meta.env.BASE_URL}${p.image.replace(\n                            /^\\/+/,\n                            ""\n                          )}`}\n                          alt={p.name}\n                          className="fantasy-builder__player-photo"\n                        />\n                      )}\n''',
            '''                      {p.image && (\n                        <img\n                          src={p.image}\n                          alt={p.name}\n                          className="fantasy-builder__player-photo"\n                        />\n                      )}\n''',
          )

          # ---------------- AdminPage ----------------
          one(
            "src/pages/AdminPage.jsx",
            'import { CURRENT_SEASON_ID } from "../lib/seasons.js";\n',
            'import { CURRENT_SEASON_ID } from "../lib/seasons.js";\nimport { getFantasySeasonStatus } from "../lib/fantasyMarket.js";\n',
          )
          one(
            "src/pages/AdminPage.jsx",
            '  const [infoMsg, setInfoMsg] = useState(null);\n',
            '  const [infoMsg, setInfoMsg] = useState(null);\n  const [marketStatus, setMarketStatus] = useState(null);\n',
          )
          one(
            "src/pages/AdminPage.jsx",
            '''      } else {\n        setGameweeks(data || []);\n      }\n\n      setLoading(false);\n''',
            '''      } else {\n        setGameweeks(data || []);\n      }\n\n      try {\n        setMarketStatus(await getFantasySeasonStatus(CURRENT_SEASON_ID));\n      } catch (marketError) {\n        console.error("Error cargando estado del mercado:", marketError);\n      }\n\n      setLoading(false);\n''',
          )
          one(
            "src/pages/AdminPage.jsx",
            '''    if (!date || !deadline) {\n      setErrorMsg("Debes indicar fecha del partido y deadline.");\n      return;\n    }\n\n    setSaving(true);\n''',
            '''    if (!marketStatus?.marketReady) {\n      setErrorMsg(\n        `El mercado ${CURRENT_SEASON_ID} todavía está en preparación (${marketStatus?.pricedPlayers ?? 0}/${marketStatus?.activePlayers ?? 0} jugadores con precio).`\n      );\n      return;\n    }\n\n    if (!date || !deadline) {\n      setErrorMsg("Debes indicar fecha del partido y deadline.");\n      return;\n    }\n\n    setSaving(true);\n''',
          )
          one(
            "src/pages/AdminPage.jsx",
            '''            <p className="admin__text">\n              Crea una <strong>gameweek</strong> indicando fecha, rival y\n              deadline para que la gente cierre sus equipos.\n            </p>\n''',
            '''            <p className="admin__text">\n              Crea una <strong>gameweek</strong> indicando fecha, rival y\n              deadline para que la gente cierre sus equipos.\n            </p>\n            {marketStatus && (\n              <p className={marketStatus.marketReady ? "admin__message admin__message--success" : "admin__message admin__message--error"}>\n                Mercado {CURRENT_SEASON_ID}: {marketStatus.marketReady ? "listo" : "en preparación"} · {marketStatus.pricedPlayers}/{marketStatus.activePlayers} jugadores con precio · base {marketStatus.baseBudget} 🍺\n              </p>\n            )}\n''',
          )
          one(
            "src/pages/AdminPage.jsx",
            '                disabled={saving}\n',
            '                disabled={saving || !marketStatus?.marketReady}\n',
          )

      - name: Build
        run: |
          npm ci
          npm run build
      - name: Remove one-off workflow
        run: rm .github/workflows/patch-fantasy-supabase-market.yml
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/fantasyMarket.js src/pages/FantasyHome.jsx src/pages/FantasyBuilder.jsx src/pages/AdminPage.jsx .github/workflows/patch-fantasy-supabase-market.yml
          git commit -m "feat(fantasy): read current market and coaches from Supabase"
          git push origin HEAD:feat/fantasy-supabase-market
